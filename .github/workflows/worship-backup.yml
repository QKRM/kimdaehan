name: Backup worship counters

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worship-counter-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup code
        uses: actions/checkout@v6
        with:
          ref: main
          path: source

      - name: Checkout backup archive
        uses: actions/checkout@v6
        with:
          ref: worship-backups
          path: archive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Capture counters
        run: node source/scripts/backup-worship.mjs archive/worship-counter

      - name: Save snapshot
        working-directory: archive
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- worship-counter)" ]]; then
            echo "No counter changes to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worship-counter
          git commit -m "Backup worship counters $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:worship-backups
